[package]
name = "hupomnemata-menubar"
version = "0.1.0"
description = "Hupomnemata menu bar companion (macOS)"
edition = "2021"
publish = false

[lib]
name = "hupomnemata_menubar"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-global-shortcut = "2"

# Meditation overlays (chunk 96): the window level and collection behaviour
# only. The version Tauri already locks; no new package.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSResponder", "NSWindow"] }
